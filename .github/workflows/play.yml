name: Play Build

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play:
    # GitHub Packages credentials are unavailable to forked pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Test and build Play distribution
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          BUFFER_OAUTH_CLIENT_ID: ${{ vars.BUFFER_OAUTH_CLIENT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
        run: ./gradlew testPlayReleaseUnitTest compilePlayDebugAndroidTestKotlin bundlePlayRelease lintPlayRelease --no-daemon --stacktrace
      - name: Verify Play bundle excludes the APK updater
        run: python3 scripts/verify-play-bundle.py app/build/outputs/bundle/playRelease/app-play-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: twidget-play-unsigned
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
