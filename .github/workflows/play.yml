name: Play Build

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play:
    # GitHub Packages credentials are unavailable to forked pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" package was removed from Google's repository.
          packages: platform-tools

      # Production signing credentials are only available to trusted branch
      # and manual builds, never to pull-request build steps.
      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Test and build signed Play release
        if: github.event_name != 'pull_request'
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          BUFFER_OAUTH_CLIENT_ID: ${{ vars.BUFFER_OAUTH_CLIENT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
        run: ./gradlew testPlayReleaseUnitTest compilePlayDebugAndroidTestKotlin assemblePlayRelease bundlePlayRelease lintPlayRelease --no-daemon --stacktrace

      - name: Test and build unsigned Play pull request
        if: github.event_name == 'pull_request'
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          BUFFER_OAUTH_CLIENT_ID: ${{ vars.BUFFER_OAUTH_CLIENT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
        run: ./gradlew testPlayReleaseUnitTest compilePlayDebugAndroidTestKotlin bundlePlayRelease lintPlayRelease --no-daemon --stacktrace
      - name: Verify Play bundle excludes the APK updater
        run: python3 scripts/verify-play-bundle.py app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Verify signed Play APK and AAB
        if: github.event_name != 'pull_request'
        run: bash scripts/verify-signed-distribution.sh app/build/outputs/apk/play/release/app-play-release.apk app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Stage signed Play downloads
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p play-artifacts
          cp app/build/outputs/apk/play/release/app-play-release.apk play-artifacts/
          cp app/build/outputs/bundle/playRelease/app-play-release.aab play-artifacts/

      - name: Upload signed Play APK and AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: twidget-play-release
          path: play-artifacts/
          if-no-files-found: error

      - name: Upload unsigned Play pull-request bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: twidget-play-unsigned
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

      - name: Remove release keystore
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/release.keystore"
