org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# SESL's picker-basic, picker-color, and picker-app intentionally share androidx.picker.
android.uniquePackageNames=false
# Beta/release CI must test their own BuildConfig, not only AGP 9's default debug.
android.onlyEnableUnitTestForTheTestedBuildType=false
